name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install buildozer
      run: |
        sudo apt update
        sudo apt install -y python3.10 python3.10-distutils openjdk-17-jdk
        pip install buildozer
    - name: Build APK
      run: |
        unzip FishingGame.zip -d FishingGame
        cd FishingGame
        buildozer init
        sed -i 's/requirements = .*/requirements = python3,pygame/' buildozer.spec
        sed -i 's/# android.api = .*/android.api = 30/' buildozer.spec
        sed -i 's/# android.ndk = .*/android.ndk = 28c/' buildozer.spec
        buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FishingGame
        path: FishingGame/bin/*.apk
